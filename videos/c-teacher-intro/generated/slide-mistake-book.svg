<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="0.52" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#e9fbf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#1a4f8b" flood-opacity="0.18"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .title { fill: #142033; font-size: 72px; font-weight: 820; }
      .body { fill: #5d6b80; font-size: 32px; font-weight: 560; }
      .small { fill: #7a8aa0; font-size: 15px; }
      .label { fill: #30445f; font-size: 15px; font-weight: 650; }
      .muted { fill: #6c7d93; font-size: 14px; }
      .ui-title { fill: #1a2332; font-size: 23px; font-weight: 750; }
      .ui-sub { fill: #7a8aa0; font-size: 14px; }
      .card-title { fill: #1f2d3d; font-size: 16px; font-weight: 560; }
      .chip { fill: #50627a; font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgA)"/>
  <rect x="978" y="150" width="900" height="2" fill="#1769d4" opacity="0.32"/>
  <rect x="104" y="964" width="620" height="2" fill="#11a7a2" opacity="0.32"/>

  <g class="font">
    <rect x="118" y="309" width="156" height="48" rx="8" fill="#e7f0ff" stroke="#b8d1f3"/>
    <text x="136" y="341" fill="#0b3f8a" font-size="24" font-weight="750">AI 错题本</text>
    <text x="118" y="439" class="title">录入错题后</text>
    <text x="118" y="520" class="title">自动生成分析</text>
    <text x="118" y="604" class="body">支持手动输入、图片上传和批量导入，</text>
    <text x="118" y="652" class="body">AI 会分析错误原因、关联知识点，</text>
    <text x="118" y="700" class="body">并生成相似练习。</text>
  </g>

  <g transform="translate(790 180)" filter="url(#shadow)" class="font">
    <rect x="0" y="0" width="980" height="720" rx="18" fill="#ffffff" stroke="#d7e3f3"/>
    <rect x="14" y="14" width="952" height="692" rx="12" fill="#f6f8fb"/>

    <rect x="14" y="14" width="952" height="62" rx="12" fill="#ffffff"/>
    <path d="M14 70H966" stroke="#e2e8f0"/>
    <rect x="34" y="29" width="32" height="32" rx="8" fill="#f8fbff" stroke="#d7e3f3"/>
    <text x="44" y="52" fill="#1769d4" font-size="24" font-weight="700">‹</text>
    <text x="82" y="42" class="ui-title">错题本</text>
    <text x="82" y="63" class="ui-sub">管理错题，AI 辅助分析薄弱知识点</text>
    <rect x="577" y="28" width="86" height="32" rx="8" fill="#f8fbff" stroke="#d7e3f3"/>
    <text x="593" y="49" class="label">复习模式</text>
    <rect x="672" y="28" width="86" height="32" rx="8" fill="#f8fbff" stroke="#d7e3f3"/>
    <text x="688" y="49" class="label">批量导入</text>
    <rect x="767" y="28" width="86" height="32" rx="8" fill="#f8fbff" stroke="#d7e3f3"/>
    <text x="783" y="49" class="label">导出打印</text>
    <rect x="862" y="28" width="84" height="32" rx="8" fill="#1769d4"/>
    <text x="878" y="49" fill="#ffffff" font-size="15" font-weight="700">手机拍照</text>

    <rect x="14" y="76" width="156" height="630" fill="#ffffff"/>
    <path d="M170 76V706" stroke="#e2e8f0"/>
    <text x="32" y="112" class="label">学生列表</text>
    <rect x="28" y="132" width="128" height="30" rx="8" fill="#e7f0ff"/>
    <text x="40" y="152" fill="#0b3f8a" font-size="13" font-weight="700">全部学生</text>
    <text x="136" y="152" fill="#0b3f8a" font-size="13" font-weight="700">3</text>
    <text x="38" y="190" fill="#9aa8ba" font-size="11" font-weight="700">学生</text>
    <rect x="28" y="204" width="128" height="54" rx="10" fill="#eef6ff"/>
    <circle cx="50" cy="231" r="16" fill="#63b7f1"/>
    <text x="74" y="226" fill="#1a2332" font-size="14" font-weight="700">陈一诺</text>
    <text x="74" y="246" fill="#7a8aa0" font-size="12">12 道错题</text>
    <circle cx="50" cy="286" r="16" fill="#9fd6ec"/>
    <text x="74" y="281" fill="#1a2332" font-size="14" font-weight="700">孟然</text>
    <text x="74" y="301" fill="#7a8aa0" font-size="12">8 道错题</text>

    <g transform="translate(198 102)">
      <text x="0" y="24" fill="#1a2332" font-size="25" font-weight="760">陈一诺 · 错题本</text>
      <text x="0" y="48" class="ui-sub">管理和复习错题，巩固薄弱知识点</text>
      <rect x="392" y="0" width="90" height="36" rx="8" fill="#ffffff" stroke="#dce5f0"/>
      <text x="408" y="23" class="muted">总题数</text>
      <text x="452" y="23" fill="#1a2332" font-size="15" font-weight="760">12</text>
      <rect x="492" y="0" width="96" height="36" rx="8" fill="#ffffff" stroke="#dce5f0"/>
      <text x="508" y="23" class="muted">已掌握</text>
      <text x="558" y="23" fill="#1a2332" font-size="15" font-weight="760">5</text>
      <rect x="598" y="0" width="96" height="36" rx="8" fill="#ffffff" stroke="#dce5f0"/>
      <text x="614" y="23" class="muted">正确率</text>
      <text x="662" y="23" fill="#1a2332" font-size="15" font-weight="760">42%</text>

      <text x="0" y="94" fill="#1769d4" font-size="15" font-weight="720">错题列表</text>
      <text x="92" y="94" fill="#7a8aa0" font-size="15" font-weight="650">统计看板</text>
      <path d="M0 105H520" stroke="#e2e8f0"/>
      <path d="M0 105H62" stroke="#1769d4" stroke-width="2"/>

      <rect x="0" y="126" width="150" height="34" rx="8" fill="#ffffff" stroke="#dce5f0"/>
      <text x="14" y="148" class="muted">搜索题目关键字</text>
      <rect x="160" y="126" width="74" height="34" rx="8" fill="#ffffff" stroke="#dce5f0"/>
      <text x="184" y="148" class="muted">数学</text>
      <rect x="244" y="126" width="118" height="34" rx="8" fill="#ffffff" stroke="#dce5f0"/>
      <text x="266" y="148" class="muted">全部知识点</text>

      <rect x="0" y="178" width="518" height="152" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="20" y="198" width="44" height="24" rx="6" fill="#fff6dd"/>
      <text x="31" y="215" fill="#946200" font-size="12" font-weight="700">中等</text>
      <rect x="72" y="198" width="66" height="24" rx="6" fill="#fff2e8"/>
      <text x="84" y="215" fill="#b85b00" font-size="12" font-weight="700">练习中</text>
      <text x="20" y="252" class="card-title">二次函数 y = a(x-h)² + k 的图像向右平移 3 个单位后，</text>
      <text x="20" y="278" class="card-title">顶点坐标如何变化？</text>
      <rect x="20" y="296" width="90" height="25" rx="12" fill="#f1f5f9"/>
      <text x="34" y="313" class="chip">函数图像</text>
      <rect x="118" y="296" width="76" height="25" rx="12" fill="#f1f5f9"/>
      <text x="134" y="313" class="chip">顶点式</text>
      <rect x="402" y="292" width="82" height="30" rx="7" fill="#1769d4"/>
      <text x="417" y="312" fill="#ffffff" font-size="13" font-weight="700">查看详情</text>

      <rect x="0" y="346" width="518" height="126" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="20" y="366" width="44" height="24" rx="6" fill="#fff6dd"/>
      <text x="31" y="383" fill="#946200" font-size="12" font-weight="700">困难</text>
      <rect x="72" y="366" width="66" height="24" rx="6" fill="#e8f8ef"/>
      <text x="86" y="383" fill="#25864d" font-size="12" font-weight="700">已掌握</text>
      <text x="20" y="420" class="card-title">阅读题根据转折词判断作者态度，学生容易忽略上下文指代。</text>
      <rect x="20" y="440" width="88" height="25" rx="12" fill="#f1f5f9"/>
      <text x="36" y="457" class="chip">阅读推断</text>
    </g>

    <g transform="translate(736 76)">
      <rect x="0" y="0" width="230" height="630" fill="#ffffff"/>
      <path d="M0 0V630" stroke="#e2e8f0"/>
      <text x="24" y="56" fill="#1a2332" font-size="19" font-weight="760">AI 分析</text>
      <text x="24" y="86" class="ui-sub">粘贴题目文本，AI 将自动分析</text>
      <text x="24" y="107" class="ui-sub">错题原因、知识点和学习建议。</text>
      <text x="24" y="151" class="label">科目</text>
      <rect x="72" y="130" width="130" height="32" rx="8" fill="#ffffff" stroke="#dce5f0"/>
      <text x="88" y="151" class="muted">数学</text>
      <rect x="24" y="188" width="178" height="38" rx="8" fill="#f1f5f9"/>
      <rect x="28" y="192" width="84" height="30" rx="6" fill="#ffffff"/>
      <text x="44" y="212" fill="#1769d4" font-size="13" font-weight="700">手动输入</text>
      <text x="126" y="212" fill="#6c7d93" font-size="13" font-weight="700">图片上传</text>
      <rect x="24" y="238" width="178" height="92" rx="9" fill="#ffffff" stroke="#dce5f0"/>
      <text x="38" y="263" class="muted">输入题目内容，或上传</text>
      <text x="38" y="284" class="muted">png/jpg/webp 错题图片。</text>
      <rect x="24" y="354" width="178" height="38" rx="8" fill="#1769d4"/>
      <text x="78" y="378" fill="#ffffff" font-size="15" font-weight="760">AI 分析</text>
      <path d="M24 426H202" stroke="#e2e8f0"/>
      <rect x="24" y="452" width="178" height="118" rx="10" fill="#f8fbff" stroke="#dce5f0"/>
      <text x="38" y="478" fill="#1769d4" font-size="13" font-weight="760">分析结果</text>
      <text x="38" y="503" class="muted">错误原因：平移方向</text>
      <text x="38" y="524" class="muted">和横坐标变化混淆。</text>
      <text x="38" y="545" class="muted">建议：生成相似练习。</text>
    </g>
  </g>
</svg>
