<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-teacher Intro</title>
  </head>
  <body>
    <div data-hf-id="hf-fsmp" id="c-teacher-intro" data-composition-id="c-teacher-intro" data-start="0" data-duration="18" data-width="1920" data-height="1080" data-track-index="0">
      <audio data-hf-id="hf-audio" id="c-teacher-intro-audio" data-start="0" data-duration="18" data-track-index="1" src="voiceover-short.mp3" data-volume="1"></audio>

      <div data-hf-id="hf-9avq" class="scene scene-1">
        <div data-hf-id="hf-i02f" class="scene-content hero-layout">
          <div data-hf-id="hf-ebeo" class="copy-stack">

            <p data-hf-id="hf-wgiu" class="lead">把学生、课程、资料、课堂记录和提醒收进同一个本机工作台。</p>
          </div>
          <div data-hf-id="hf-jloz" class="desktop-frame" aria-hidden="true">
            <div class="preview-shell">
              <img src="assets/dashboard.png" alt="工作台截图">
            </div>
          </div>
        </div>
      </div>

      <div data-hf-id="hf-ajw4" class="wipe wipe-1"></div>

      <div data-hf-id="hf-5crp" class="scene scene-2">
        <div data-hf-id="hf-48n3" class="scene-content board-layout">
          <div data-hf-id="hf-1w49" class="section-copy">
            <p data-hf-id="hf-vk1o" class="eyebrow">从学生出发</p>
            <h2 data-hf-id="hf-4kel">每个学生都有独立节奏</h2>
            <p data-hf-id="hf-tvpe">档案、学科进度、学习风格和错题状态，在卡片里持续更新。</p>
          </div>

            <img src="assets/students.png" alt="学生管理截图">
          </div>
        </div>
      </div>

      <div data-hf-id="hf-j7rz" class="wipe wipe-2"></div>

      <div data-hf-id="hf-4l3w" class="scene scene-3">
        <div data-hf-id="hf-qi8i" class="scene-content workflow-layout">
          <div data-hf-id="hf-bow6" class="section-copy compact">
            <p data-hf-id="hf-peaw" class="eyebrow">功能架构</p>
            <h2 data-hf-id="hf-36gm">把教学动作串成闭环</h2>
            <p data-hf-id="hf-tvpe2">前端页面、SQLite、本机系统能力和 AI 分析层按职责连接。</p>
          </div>
          <div data-hf-id="hf-arch" class="arch-frame" aria-hidden="true">
            <img src="architecture.html" alt="功能架构图">
          </div>
        </div>
      </div>

      <div data-hf-id="hf-f9ny" class="wipe wipe-3"></div>

      <div data-hf-id="hf-s2lf" class="scene scene-4">
        <div data-hf-id="hf-g6dk" class="scene-content closing-layout">
          <p data-hf-id="hf-56ua" class="eyebrow">C-teacher</p>
          <h2 data-hf-id="hf-95mm">教师的本机教学工作台</h2>
          <p data-hf-id="hf-wgww">管理更集中，复盘更清晰，下一节课更有依据。</p>
          <div data-hf-id="hf-02z5" class="shot-grid" aria-hidden="true">
            <img src="assets/records.png" alt="课堂记录截图">
            <img src="assets/materials.png" alt="资料库截图">
            <img src="assets/students.png" alt="学生管理截图">
            <img src="assets/dashboard.png" alt="工作台截图">

      <div data-hf-id="hf-ltrl" class="ambient line-a" aria-hidden="true"></div>
      <div data-hf-id="hf-prvm" class="ambient line-b" aria-hidden="true"></div>

      <style>
        #c-teacher-intro {
          --bg: #f4f8ff;
          --surface: #fbfdff;
          --primary: #1769d4;
          --primary-strong: #0b3f8a;
          --action: #11a7a2;
          --text: #142033;
          --muted: #5d6b80;
          --border: #d7e3f3;
          --warning: #a86913;
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          color: var(--text);
          background:
            linear-gradient(155deg, rgba(23, 105, 212, 0.12), transparent 38%),
            linear-gradient(330deg, rgba(17, 167, 162, 0.14), transparent 46%),
            var(--bg);
          font-family: sans-serif;
        }

        * { box-sizing: border-box; }
        h1, h2, p { margin: 0; }
        img { display: block; width: 100%; height: 100%; object-fit: cover; }

        .scene {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        .scene-content {
          width: 100%;
          height: 100%;
          padding: 110px 138px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 84px;
          box-sizing: border-box;
        }

        .copy-stack, .section-copy {
          max-width: 770px;
          display: flex;
          flex-direction: column;
          gap: 26px;
        }

        .section-copy.compact { max-width: 860px; }

        .eyebrow {
          width: fit-content;
          margin: 0;
          padding: 11px 18px;
          border: 1px solid color-mix(in srgb, var(--primary) 24%, var(--border));
          border-radius: 8px;
          color: var(--primary-strong);
          background: #e7f0ff;
          font-size: 24px;
          font-weight: 700;
        }

        h1 { max-width: 820px; font-size: 96px; line-height: 1.05; font-weight: 800; letter-spacing: 0; }
        h2 { max-width: 780px; font-size: 78px; line-height: 1.08; font-weight: 800; letter-spacing: 0; }
        .lead, .section-copy p, .closing-layout p { max-width: 760px; color: var(--muted); font-size: 34px; line-height: 1.45; font-weight: 500; }

        .desktop-frame, .shot-frame, .arch-frame {
          overflow: hidden;
          border-radius: 18px;
          border: 1px solid var(--border);
          background: rgba(255,255,255,.94);
          box-shadow: 0 28px 80px rgba(26, 79, 139, 0.2);
        }

        .desktop-frame { width: 840px; height: 530px; }
        .shot-frame { width: 840px; height: 620px; }
        .arch-frame { width: 1020px; height: 560px; background: #020617; border-color: #1e293b; box-shadow: 0 28px 80px rgba(2, 6, 23, 0.55); }
        .preview-shell { width: 100%; height: 100%; padding: 18px; background: linear-gradient(180deg, #ffffff, #f4f8ff); }

        .board-layout { justify-content: space-between; }
        .workflow-layout { flex-direction: column; justify-content: center; gap: 48px; }
        .closing-layout { flex-direction: column; justify-content: center; gap: 30px; text-align: center; }
        .closing-layout h2 { max-width: 980px; font-size: 90px; }

        .shot-grid {
          width: min(1160px, 100%);
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 18px;
        }
        .shot-grid img { height: 250px; object-fit: cover; border-radius: 14px; border: 1px solid #d7e3f3; box-shadow: 0 18px 34px rgba(26, 79, 139, 0.14); }

        .wipe {
          position: absolute;
          inset: 0;
          z-index: 8;
          background: linear-gradient(90deg, var(--primary), var(--action));
          transform: translateX(-105%);
        }

        .ambient {
          position: absolute;
          z-index: 0;
          pointer-events: none;
          border-radius: 999px;
          background: color-mix(in srgb, var(--primary) 28%, transparent);
        }
        .line-a { width: 900px; height: 2px; left: 980px; top: 150px; }
        .line-b { width: 620px; height: 2px; left: 104px; bottom: 116px; background: color-mix(in srgb, var(--action) 30%, transparent); }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.set('.scene', { opacity: 0 }, 0);
        tl.set('.scene-1', { opacity: 1 }, 0);
        tl.set('.scene-2', { opacity: 1 }, 4.4);
        tl.set('.scene-3', { opacity: 1 }, 8.6);
        tl.set('.scene-4', { opacity: 1 }, 13.3);

        tl.from('.scene-1 .eyebrow', { y: 28, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0.15);
        tl.from('.scene-1 h1', { y: 48, opacity: 0, duration: 0.58, ease: 'power3.out' }, 0.3);
        tl.from('.scene-1 .lead', { y: 34, opacity: 0, duration: 0.48, ease: 'power2.out' }, 0.55);
        tl.from('.desktop-frame', { x: 70, opacity: 0, scale: 0.96, duration: 0.68, ease: 'power3.out' }, 0.4);

        tl.to('.wipe-1', { x: '0%', duration: 0.42, ease: 'power2.inOut' }, 4.0);
        tl.set('.scene-1', { opacity: 0 }, 4.42);
        tl.to('.wipe-1', { x: '105%', duration: 0.42, ease: 'power2.inOut' }, 4.49);
        tl.from('.scene-2 .eyebrow', { y: 26, opacity: 0, duration: 0.4, ease: 'power3.out' }, 4.62);
        tl.from('.scene-2 h2', { y: 44, opacity: 0, duration: 0.52, ease: 'power3.out' }, 4.75);
        tl.from('.scene-2 .section-copy p', { y: 28, opacity: 0, duration: 0.42, ease: 'power2.out' }, 4.95);
        tl.from('.shot-frame', { x: 56, opacity: 0, scale: 0.97, duration: 0.6, ease: 'power3.out' }, 4.76);

        tl.to('.wipe-2', { x: '0%', duration: 0.42, ease: 'power2.inOut' }, 8.1);
        tl.set('.scene-2', { opacity: 0 }, 8.52);
        tl.to('.wipe-2', { x: '105%', duration: 0.42, ease: 'power2.inOut' }, 8.59);
        tl.from('.scene-3 .eyebrow', { y: 26, opacity: 0, duration: 0.4, ease: 'power3.out' }, 8.74);
        tl.from('.scene-3 h2', { y: 44, opacity: 0, duration: 0.52, ease: 'power3.out' }, 8.9);
        tl.from('.scene-3 .section-copy p', { y: 28, opacity: 0, duration: 0.42, ease: 'power2.out' }, 9.08);
        tl.from('.arch-frame', { y: 40, opacity: 0, scale: 0.98, duration: 0.66, ease: 'power3.out' }, 8.96);

        tl.to('.wipe-3', { x: '0%', duration: 0.42, ease: 'power2.inOut' }, 12.75);
        tl.set('.scene-3', { opacity: 0 }, 13.18);
        tl.to('.wipe-3', { x: '105%', duration: 0.42, ease: 'power2.inOut' }, 13.25);
        tl.from('.scene-4 .eyebrow', { y: 28, opacity: 0, duration: 0.42, ease: 'power3.out' }, 13.4);
        tl.from('.scene-4 h2', { y: 46, opacity: 0, duration: 0.58, ease: 'power3.out' }, 13.58);
        tl.from('.scene-4 p', { y: 30, opacity: 0, duration: 0.45, ease: 'power2.out' }, 13.82);
        tl.from('.shot-grid img', { y: 24, opacity: 0, stagger: 0.07, duration: 0.34, ease: 'power2.out' }, 14.08);
        tl.to('.closing-layout', { opacity: 0, scale: 0.985, duration: 0.58, ease: 'power2.inOut' }, 16.55);

        tl.to('.line-a', { x: -60, opacity: 0.55, duration: 18, ease: 'sine.inOut' }, 0);
        tl.to('.line-b', { x: 70, opacity: 0.6, duration: 18, ease: 'sine.inOut' }, 0);

        window.__timelines['c-teacher-intro'] = tl;
      </script>
    </div>
  </body>
</html>
